<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - FundooNotes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #333;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #111;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <p class="subtitle">
        Enter your new password
    </p>

    <form id="resetPasswordForm">

        <label for="password">
            New Password
        </label>

        <input
                type="password"
                id="password"
                placeholder="Enter new password"
                required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
        >

        <button type="submit" id="resetButton">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

    /*
     * Your email link:
     *
     * http://localhost:8081/reset-password?token=JWT
     *
     * Here we extract the token from the URL.
     */

    const urlParams = new URLSearchParams(window.location.search);

    const token = urlParams.get("token");


    const form = document.getElementById("resetPasswordForm");

    const message = document.getElementById("message");

    const resetButton = document.getElementById("resetButton");


    // Check whether token exists

    if (!token) {

        message.innerText = "Invalid reset link. Token is missing.";

        message.className = "error";

        resetButton.disabled = true;
    }


    form.addEventListener("submit", async function (event) {

        event.preventDefault();


        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        // Confirm password validation

        if (password !== confirmPassword) {

            message.innerText =
                "Passwords do not match.";

            message.className = "error";

            return;
        }


        if (!token) {

            message.innerText =
                "Invalid reset token.";

            message.className = "error";

            return;
        }


        resetButton.disabled = true;

        resetButton.innerText = "Resetting...";


        try {

            /*
             * Your actual backend API
             *
             * PATCH /api/users?token=JWT
             */

            const response = await fetch(
                "/api/users?token=" + encodeURIComponent(token),
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        password: password
                    })
                }
            );


            const result = await response.json();


            if (response.ok) {

                message.innerText =
                    result.message ||
                    "Password reset successfully.";

                message.className = "success";

                form.reset();

            } else {

                message.innerText =
                    result.message ||
                    "Password reset failed.";

                message.className = "error";
            }


        } catch (error) {

            console.error(error);

            message.innerText =
                "Unable to connect to server.";

            message.className = "error";

        } finally {

            resetButton.disabled = false;

            resetButton.innerText = "Reset Password";
        }

    });

</script>

</body>

</html>
